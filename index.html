<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kedai Food - Pemesanan Online</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .grab-green { background-color: #00B14F; }
        .grab-text-green { color: #00B14F; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in { animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>

    <!-- Firebase SDK Modular (v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, getDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // FIREBASE CONFIG MILIK ANDA
        const firebaseConfig = {
            apiKey: "AIzaSyDbR7KdRXxBgV0XK0yDw9y62gZ5RQHWfxg",
            authDomain: "kasir-e6c05.firebaseapp.com",
            projectId: "kasir-e6c05",
            storageBucket: "kasir-e6c05.firebasestorage.app",
            messagingSenderId: "1033897386989",
            appId: "1:1033897386989:web:ab40cc6aa75835ab94bde4",
            measurementId: "G-829Q02ZSBL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let menuList = [];
        let keranjang = {}; 
        let kategoriAktif = 'Semua';

        // Custom Toast Pop-up Elegan
        window.showNotice = function(pesan, tipe = 'warning', judul = 'Informasi') {
            const modal = document.getElementById('noticeModal');
            const iconContainer = document.getElementById('noticeIcon');
            const titleEl = document.getElementById('noticeTitle');
            const messageEl = document.getElementById('noticeMessage');

            titleEl.innerText = judul;
            messageEl.innerText = pesan;

            if (tipe === 'success') {
                iconContainer.className = "w-12 h-12 rounded-full bg-green-100 text-green-600 flex items-center justify-center mx-auto mb-3";
                iconContainer.innerHTML = `<i data-lucide="check-circle-2" class="w-7 h-7"></i>`;
            } else if (tipe === 'danger') {
                iconContainer.className = "w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-3";
                iconContainer.innerHTML = `<i data-lucide="alert-circle" class="w-7 h-7"></i>`;
            } else {
                iconContainer.className = "w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto mb-3";
                iconContainer.innerHTML = `<i data-lucide="info" class="w-7 h-7"></i>`;
            }

            modal.classList.remove('hidden');
            lucide.createIcons();
        };

        window.closeNotice = function() {
            document.getElementById('noticeModal').classList.add('hidden');
        };

        // Load Kategori Realtime
        onSnapshot(collection(db, "categories"), (snapshot) => {
            let categories = ['Semua'];
            snapshot.forEach((docSnap) => {
                categories.push(docSnap.data().nama);
            });
            renderCategoryTabs(categories);
        });

        function renderCategoryTabs(categories) {
            const catContainer = document.getElementById('categoryTabs');
            if(!catContainer) return;
            catContainer.innerHTML = '';

            categories.forEach(cat => {
                const isSelected = cat === kategoriAktif;
                catContainer.innerHTML += `
                    <button onclick="setKategori('${cat}')" 
                        class="px-4 py-2 text-xs font-bold rounded-full whitespace-nowrap transition-all ${
                            isSelected 
                            ? 'grab-green text-white shadow-sm' 
                            : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                        }">
                        ${cat}
                    </button>
                `;
            });
        }

        window.setKategori = function(cat) {
            kategoriAktif = cat;
            onSnapshot(collection(db, "categories"), (snapshot) => {
                let categories = ['Semua'];
                snapshot.forEach((docSnap) => categories.push(docSnap.data().nama));
                renderCategoryTabs(categories);
            });
            renderMenu();
        };

        // Fetch Semua Menu
        onSnapshot(collection(db, "menus"), (snapshot) => {
            menuList = [];
            snapshot.forEach((docSnap) => {
                menuList.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderMenu();
        });

        window.renderMenu = function() {
            const container = document.getElementById('menuListContainer');
            const searchInput = document.getElementById('searchMenu').value.toLowerCase();
            container.innerHTML = '';

            const filtered = menuList.filter(m => {
                const matchCat = (kategoriAktif === 'Semua' || m.kategori === kategoriAktif);
                const matchSearch = m.nama.toLowerCase().includes(searchInput);
                return matchCat && matchSearch;
            });

            if(filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 text-gray-400">
                        <i data-lucide="utensils-crossed" class="w-12 h-12 mx-auto mb-2 stroke-1"></i>
                        <p class="text-xs">Tidak ada menu yang sesuai</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            filtered.forEach(item => {
                const qty = keranjang[item.id]?.jumlah || 0;
                const isReady = item.tersedia !== false;
                const defaultImg = "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300&auto=format&fit=crop&q=80";

                container.innerHTML += `
                    <div class="bg-white rounded-2xl p-3 border border-gray-100 shadow-sm flex items-center justify-between space-x-3 transition relative overflow-hidden ${!isReady ? 'bg-gray-50' : 'hover:shadow-md'}">
                        
                        <div class="relative flex-shrink-0">
                            <img src="${item.fotoUrl || defaultImg}" alt="${item.nama}" class="w-20 h-20 rounded-xl object-cover border bg-gray-100 ${!isReady ? 'grayscale opacity-60' : ''}">
                            ${!isReady ? `
                                <span class="absolute inset-0 bg-black/40 rounded-xl flex items-center justify-center text-[10px] font-extrabold text-white uppercase tracking-wider">
                                    Habis
                                </span>
                            ` : ''}
                        </div>
                        
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center space-x-1">
                                <h3 class="font-bold text-gray-800 text-sm truncate ${!isReady ? 'text-gray-400 line-through' : ''}">${item.nama}</h3>
                            </div>
                            <p class="text-xs text-gray-400 line-clamp-1 mt-0.5">${item.deskripsi || 'Menu spesial pilihan khas kedai.'}</p>
                            <p class="text-sm font-extrabold mt-1 ${!isReady ? 'text-gray-400' : 'grab-text-green'}">Rp ${Number(item.harga).toLocaleString('id-ID')}</p>
                        </div>

                        <div class="flex flex-col items-end justify-between self-stretch">
                            <span class="text-[10px] font-semibold text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">${item.kategori || 'Umum'}</span>
                            
                            ${!isReady ? `
                                <button disabled class="bg-gray-200 text-gray-400 text-xs font-bold px-3 py-1.5 rounded-xl cursor-not-allowed">
                                    Habis
                                </button>
                            ` : qty === 0 ? `
                                <button onclick="tambahKeKeranjang('${item.id}')" class="grab-green text-white text-xs font-bold px-3.5 py-1.5 rounded-xl shadow-sm hover:opacity-90 transition">
                                    + Tambah
                                </button>
                            ` : `
                                <div class="flex items-center space-x-2 bg-gray-100 rounded-xl p-1 border">
                                    <button onclick="ubahJumlah('${item.id}', -1)" class="w-6 h-6 rounded-lg bg-white font-bold text-gray-700 shadow-sm flex items-center justify-center text-xs">-</button>
                                    <span class="text-xs font-bold w-4 text-center">${qty}</span>
                                    <button onclick="ubahJumlah('${item.id}', 1)" class="w-6 h-6 rounded-lg grab-green font-bold text-white shadow-sm flex items-center justify-center text-xs">+</button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
            hitungTotal();
        };

        window.tambahKeKeranjang = function(id) {
            const item = menuList.find(m => m.id === id);
            if(item && item.tersedia !== false) {
                keranjang[id] = { 
                    ...item, 
                    jumlah: 1, 
                    catatan: "",
                    pedas: "Biasa",
                    es: "Normal" 
                };
                renderMenu();
            }
        };

        window.ubahJumlah = function(id, delta) {
            if (keranjang[id]) {
                keranjang[id].jumlah += delta;
                if (keranjang[id].jumlah <= 0) delete keranjang[id];
            }
            renderMenu();
        };

        function hitungTotal() {
            let total = 0;
            let totalItems = 0;
            for (let id in keranjang) {
                total += keranjang[id].harga * keranjang[id].jumlah;
                totalItems += keranjang[id].jumlah;
            }

            const floatBar = document.getElementById('floatingCartBar');
            if (totalItems > 0) {
                floatBar.classList.remove('translate-y-full');
                document.getElementById('cartBadge').innerText = totalItems;
                document.getElementById('cartTotal').innerText = 'Rp ' + total.toLocaleString('id-ID');
            } else {
                floatBar.classList.add('translate-y-full');
            }
            return total;
        }

        window.bukaModalCheckout = function() {
            const itemsList = document.getElementById('checkoutItemsList');
            itemsList.innerHTML = '';
            let total = 0;

            for (let id in keranjang) {
                const item = keranjang[id];
                const subtotal = item.harga * item.jumlah;
                total += subtotal;

                itemsList.innerHTML += `
                    <div class="py-2.5 border-b border-gray-100 space-y-1.5">
                        <div class="flex justify-between items-start">
                            <div class="flex-1 pr-2">
                                <p class="font-bold text-xs text-gray-800">${item.nama}</p>
                                <p class="text-[11px] text-gray-500">${item.jumlah}x @ Rp ${item.harga.toLocaleString('id-ID')}</p>
                            </div>
                            <p class="font-bold text-xs text-gray-800">Rp ${subtotal.toLocaleString('id-ID')}</p>
                        </div>
                        
                        <!-- Variasi & Modifiers / Add-ons -->
                        <div class="grid grid-cols-2 gap-1.5 pt-1">
                            <div>
                                <label class="block text-[10px] text-gray-400 font-semibold mb-0.5">Level Pedas</label>
                                <select onchange="updateModifier('${id}', 'pedas', this.value)" class="text-[11px] border border-gray-200 rounded-lg p-1 w-full bg-white text-gray-700 outline-none">
                                    <option value="Tidak Pedas" ${item.pedas === 'Tidak Pedas' ? 'selected' : ''}>Tidak Pedas</option>
                                    <option value="Biasa" ${item.pedas === 'Biasa' ? 'selected' : ''}>Biasa</option>
                                    <option value="Sedang" ${item.pedas === 'Sedang' ? 'selected' : ''}>Sedang</option>
                                    <option value="Sangat Pedas" ${item.pedas === 'Sangat Pedas' ? 'selected' : ''}>Sangat Pedas 🔥</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] text-gray-400 font-semibold mb-0.5">Opsi Es</label>
                                <select onchange="updateModifier('${id}', 'es', this.value)" class="text-[11px] border border-gray-200 rounded-lg p-1 w-full bg-white text-gray-700 outline-none">
                                    <option value="Normal" ${item.es === 'Normal' ? 'selected' : ''}>Normal Ice</option>
                                    <option value="Less Ice" ${item.es === 'Less Ice' ? 'selected' : ''}>Less Ice 🧊</option>
                                    <option value="Tanpa Es" ${item.es === 'Tanpa Es' ? 'selected' : ''}>Tanpa Es (Warm)</option>
                                </select>
                            </div>
                        </div>

                        <input type="text" onchange="updateCatatan('${id}', this.value)" placeholder="Catatan tambahan (opsional)" value="${item.catatan || ''}" class="text-[11px] border border-gray-200 rounded-lg p-1.5 w-full text-gray-600 focus:outline-none focus:ring-1 focus:ring-green-500 bg-gray-50">
                    </div>
                `;
            }

            document.getElementById('modalTotalHarga').innerText = 'Rp ' + total.toLocaleString('id-ID');
            document.getElementById('checkoutModal').classList.remove('hidden');
        };

        window.tutupModalCheckout = function() {
            document.getElementById('checkoutModal').classList.add('hidden');
        };

        window.updateCatatan = function(id, val) {
            if(keranjang[id]) keranjang[id].catatan = val;
        };

        window.updateModifier = function(id, tipe, val) {
            if(keranjang[id]) keranjang[id][tipe] = val;
        };

        // Fitur Riwayat Pesanan Lokal (LocalStorage)
        function simpanKeRiwayatLokal(order) {
            try {
                let current = JSON.parse(localStorage.getItem('kedai_orders_history') || '[]');
                current.unshift(order);
                if(current.length > 10) current = current.slice(0, 10);
                localStorage.setItem('kedai_orders_history', JSON.stringify(current));
            } catch(e) { console.error("Gagal simpan riwayat lokal:", e); }
        }

        window.bukaRiwayatPesanan = function() {
            const container = document.getElementById('historyItemsList');
            container.innerHTML = '';

            try {
                const history = JSON.parse(localStorage.getItem('kedai_orders_history') || '[]');
                if(history.length === 0) {
                    container.innerHTML = `<p class="text-center text-gray-400 text-xs py-8">Belum ada riwayat pesanan.</p>`;
                } else {
                    history.forEach(ord => {
                        let itemNames = ord.items.map(i => `${i.nama} (x${i.jumlah})`).join(', ');
                        container.innerHTML += `
                            <div class="bg-gray-50 border border-gray-100 rounded-xl p-3 space-y-1 text-xs">
                                <div class="flex justify-between items-center border-b pb-1">
                                    <span class="font-extrabold text-gray-800">#${ord.noInvoice}</span>
                                    <span class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold">${ord.metodePembayaran}</span>
                                </div>
                                <p class="text-gray-600 text-[11px] line-clamp-2">${itemNames}</p>
                                <div class="flex justify-between items-center pt-1 font-bold">
                                    <span class="text-gray-400 text-[10px]">${ord.waktu}</span>
                                    <span class="grab-text-green">Rp ${Number(ord.total).toLocaleString('id-ID')}</span>
                                </div>
                            </div>
                        `;
                    });
                }
            } catch(e) {
                container.innerHTML = `<p class="text-center text-red-400 text-xs py-8">Gagal membaca riwayat.</p>`;
            }

            document.getElementById('historyModal').classList.remove('hidden');
        };

        window.tutupModalHistory = function() {
            document.getElementById('historyModal').classList.add('hidden');
        };

        window.prosesPesanan = async function() {
            const nama = document.getElementById('namaPemesan').value.trim();
            const meja = document.getElementById('nomorMeja').value.trim();
            const metodePembayaran = document.getElementById('metodePembayaran').value;

            if (!nama || !meja) {
                showNotice("Harap isi Nama Pemesan dan Nomor Meja terlebih dahulu!", "warning", "Lengkapi Data");
                return;
            }
            if (Object.keys(keranjang).length === 0) {
                showNotice("Keranjang belanjaan Anda masih kosong!", "warning", "Keranjang Kosong");
                return;
            }

            let nomorWaKasir = "6281234567890";
            let nomorWaOwner = "6289876543210";
            let fonnteToken = "";

            try {
                const docSnap = await getDoc(doc(db, "settings", "config"));
                if (docSnap.exists()) {
                    const cfg = docSnap.data();
                    if(cfg.nomorWaKasir) nomorWaKasir = cfg.nomorWaKasir;
                    if(cfg.nomorWaOwner) nomorWaOwner = cfg.nomorWaOwner;
                    if(cfg.fonnteToken) fonnteToken = cfg.fonnteToken;
                }
            } catch(e) {
                console.log("Pengaturan bawaan digunakan", e);
            }

            const itemsOrdered = [];
            let detailPesananStr = "";
            let total = 0;

            for (let id in keranjang) {
                const item = keranjang[id];
                const subtotal = item.harga * item.jumlah;
                total += subtotal;
                
                const modStr = `Pedas: ${item.pedas || 'Biasa'}, Es: ${item.es || 'Normal'}`;
                const catStr = item.catatan ? `${item.catatan} (${modStr})` : modStr;

                itemsOrdered.push({
                    menu_id: id,
                    nama: item.nama,
                    harga: item.harga,
                    jumlah: item.jumlah,
                    catatan: catStr,
                    subtotal: subtotal
                });

                detailPesananStr += `• *${item.nama}* (${item.jumlah}x) = Rp ${subtotal.toLocaleString('id-ID')}\n  _Varian: ${modStr}_\n  _Catatan: ${item.catatan || '-'}\n`;
            }

            const noInvoice = "INV-" + Date.now().toString().slice(-6);

            try {
                await addDoc(collection(db, "orders"), {
                    no_invoice: noInvoice,
                    nama_pemesan: nama,
                    meja: meja,
                    metode_pembayaran: metodePembayaran,
                    items: itemsOrdered,
                    total_harga: total,
                    status: "Pending",
                    createdAt: serverTimestamp()
                });

                // Simpan ke LocalStorage HP
                simpanKeRiwayatLokal({
                    noInvoice: noInvoice,
                    items: itemsOrdered,
                    total: total,
                    metodePembayaran: metodePembayaran,
                    waktu: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
                });

                const pesanWA = `🔔 *PESANAN BARU - KEDAI*\n----------------------------------------\n*No. Invoice:* #${noInvoice}\n*Nama:* ${nama}\n*Meja / Tipe:* ${meja}\n*Pembayaran:* ${metodePembayaran}\n\n*Detail Pesanan:*\n${detailPesananStr}\n----------------------------------------\n*Total Pembayaran:* Rp ${total.toLocaleString('id-ID')}\n*Status:* Menunggu Konfirmasi Kasir\n*Estimasi Penyajian:* 15 - 20 Menit`;

                if (fonnteToken && fonnteToken !== "") {
                    fetch('https://api.fonnte.com/send', {
                        method: 'POST',
                        headers: { 'Authorization': fonnteToken },
                        body: new URLSearchParams({ 'target': nomorWaOwner, 'message': pesanWA })
                    }).catch(err => console.error(err));
                }

                const urlWa = `https://wa.me/${nomorWaKasir}?text=${encodeURIComponent(pesanWA)}`;
                
                keranjang = {};
                tutupModalCheckout();
                renderMenu();

                showNotice("Pesanan dikirim! Estimasi penyajian 15-20 Menit. Silakan selesaikan pesan di WhatsApp.", "success", "Pesanan Terkirim");

                setTimeout(() => {
                    window.open(urlWa, '_blank');
                }, 1200);

            } catch (error) {
                console.error("Error: ", error);
                showNotice("Terjadi kesalahan saat memproses pesanan. Silakan coba lagi.", "danger", "Gagal Mengirim");
            }
        };

        document.getElementById('searchMenu').addEventListener('input', renderMenu);
    </script>
</head>
<body class="bg-gray-50 font-sans pb-28">

    <!-- Header Grab Style -->
    <header class="grab-green text-white p-4 sticky top-0 z-20 shadow-md rounded-b-2xl">
        <div class="max-w-md mx-auto space-y-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
                        <i data-lucide="utensils" class="w-5 h-5 text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-base font-extrabold leading-tight">Kedai Food</h1>
                        <p class="text-[11px] text-green-100 flex items-center gap-1">
                            <i data-lucide="map-pin" class="w-3 h-3"></i> Pesan Langsung dari Meja
                        </p>
                    </div>
                </div>
                <!-- Tombol Riwayat Pesanan Lokal -->
                <button onclick="bukaRiwayatPesanan()" class="bg-white/20 hover:bg-white/30 text-white text-[10px] px-2.5 py-1 rounded-full font-bold backdrop-blur-sm flex items-center gap-1 transition">
                    <i data-lucide="history" class="w-3 h-3"></i> Riwayat
                </button>
            </div>

            <!-- Search Bar -->
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-3"></i>
                <input type="text" id="searchMenu" placeholder="Cari makanan atau minuman..." 
                    class="w-full bg-white text-gray-800 text-xs pl-9 pr-4 py-2.5 rounded-xl shadow-inner outline-none placeholder-gray-400">
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <!-- Horizontal Category Tabs -->
        <div class="flex space-x-2 overflow-x-auto no-scrollbar py-1" id="categoryTabs"></div>

        <!-- Banner Promo & Estimasi Waktu -->
        <div class="bg-gradient-to-r from-emerald-500 to-teal-600 rounded-2xl p-3.5 text-white flex justify-between items-center shadow-sm">
            <div>
                <p class="text-[10px] font-bold text-emerald-100 uppercase tracking-wider">Estimasi Waktu Dapur ⚡</p>
                <p class="text-xs font-extrabold mt-0.5">Penyajian Pesanan 15 - 20 Menit!</p>
            </div>
            <i data-lucide="clock" class="w-7 h-7 text-yellow-300"></i>
        </div>

        <!-- Daftar Menu Grid -->
        <div class="space-y-3" id="menuListContainer">
            <p class="text-center text-gray-400 text-xs py-10">Memuat menu kedai...</p>
        </div>
    </main>

    <!-- Floating Cart Bar -->
    <div id="floatingCartBar" class="fixed bottom-0 left-0 right-0 p-4 z-30 transition-transform duration-300 transform translate-y-full">
        <div class="max-w-md mx-auto">
            <button onclick="bukaModalCheckout()" class="w-full grab-green text-white p-3.5 rounded-2xl shadow-2xl flex justify-between items-center hover:opacity-95 transition">
                <div class="flex items-center space-x-3">
                    <div class="relative">
                        <i data-lucide="shopping-bag" class="w-6 h-6"></i>
                        <span id="cartBadge" class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold border-2 border-green-600">0</span>
                    </div>
                    <div class="text-left">
                        <p class="text-[10px] text-green-100 font-medium">Keranjang Pesanan</p>
                        <p class="font-extrabold text-sm" id="cartTotal">Rp 0</p>
                    </div>
                </div>
                <div class="flex items-center space-x-1 font-bold text-xs bg-white/20 px-3 py-1.5 rounded-xl">
                    <span>Lihat Pesanan</span>
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </div>
            </button>
        </div>
    </div>

    <!-- Modal Checkout Bottom Sheet -->
    <div id="checkoutModal" class="fixed inset-0 bg-black/60 z-40 hidden flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-3xl p-5 space-y-4 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="font-bold text-gray-800 text-sm flex items-center gap-2">
                    <i data-lucide="receipt" class="w-4 h-4 grab-text-green"></i> Konfirmasi Pesanan
                </h2>
                <button onclick="tutupModalCheckout()" class="text-gray-400 hover:text-gray-600 p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Form Pemesan -->
            <div class="bg-gray-50 p-3 rounded-2xl space-y-2 border border-gray-100">
                <p class="text-xs font-bold text-gray-600">Informasi Pemesan</p>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="namaPemesan" placeholder="Nama Anda" class="w-full border border-gray-200 p-2 rounded-xl text-xs outline-none focus:ring-1 focus:ring-green-500 bg-white">
                    <input type="text" id="nomorMeja" placeholder="Nomor Meja / Takeaway" class="w-full border border-gray-200 p-2 rounded-xl text-xs outline-none focus:ring-1 focus:ring-green-500 bg-white">
                </div>

                <!-- Opsi Metode Pembayaran -->
                <div>
                    <label class="block text-[11px] font-bold text-gray-600 mb-1">Metode Pembayaran</label>
                    <select id="metodePembayaran" class="w-full border border-gray-200 p-2 rounded-xl text-xs outline-none focus:ring-1 focus:ring-green-500 bg-white text-gray-700">
                        <option value="Tunai di Kasir">Tunai di Kasir</option>
                        <option value="QRIS / E-Wallet">QRIS / E-Wallet</option>
                        <option value="Transfer Bank">Transfer Bank</option>
                    </select>
                </div>
            </div>

            <!-- Rincian Pesanan -->
            <div>
                <p class="text-xs font-bold text-gray-600 mb-1">Rincian Menu & Variasi</p>
                <div id="checkoutItemsList" class="divide-y divide-gray-100"></div>
            </div>

            <div class="border-t pt-3 space-y-3">
                <div class="flex justify-between text-sm font-extrabold text-gray-800">
                    <span>Total Pembayaran</span>
                    <span id="modalTotalHarga" class="grab-text-green">Rp 0</span>
                </div>
                <button onclick="prosesPesanan()" class="w-full grab-green text-white py-3.5 rounded-2xl font-bold text-xs shadow-lg hover:opacity-90 flex justify-center items-center gap-2">
                    <i data-lucide="send" class="w-4 h-4"></i> Kirim Pesanan via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Riwayat Pesanan Lokal -->
    <div id="historyModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl animate-fade-in space-y-4 max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-extrabold text-sm text-gray-800 flex items-center gap-2">
                    <i data-lucide="history" class="w-4 h-4 grab-text-green"></i> Riwayat Pesanan HP Ini
                </h3>
                <button onclick="tutupModalHistory()" class="text-gray-400 hover:text-gray-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div id="historyItemsList" class="space-y-2 overflow-y-auto flex-1 pr-1"></div>

            <button onclick="tutupModalHistory()" class="w-full bg-gray-100 text-gray-700 py-2.5 rounded-xl font-bold text-xs hover:bg-gray-200 transition">
                Tutup
            </button>
        </div>
    </div>

    <!-- Custom Modal Pop-up Notice -->
    <div id="noticeModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs rounded-3xl p-5 text-center shadow-2xl animate-fade-in space-y-2">
            <div id="noticeIcon"></div>
            <h3 id="noticeTitle" class="font-extrabold text-base text-gray-800"></h3>
            <p id="noticeMessage" class="text-xs text-gray-500 leading-relaxed px-2"></p>
            <div class="pt-3">
                <button onclick="closeNotice()" class="w-full grab-green text-white py-2.5 rounded-xl font-bold text-xs shadow hover:opacity-95 transition">
                    Mengerti
                </button>
            </div>
        </div>
    </div>

</body>
</html>
